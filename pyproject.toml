[project]
name = "projeto-tlc"
version = "0.1.0"
description = "Monolito FastAPI do Projeto TLC"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
projeto-tlc = "src.main:run"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
